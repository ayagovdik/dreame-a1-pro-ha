start_zone_mowing:
  name: Start zone mowing
  description: Start mowing for one or more explicit zone IDs.
  target:
    entity:
      integration: dreame_a1
      domain: lawn_mower
  fields:
    zone_ids:
      name: Zone IDs
      description: List of zone IDs to mow, for example [1, 3].
      required: true
      example: [1, 3]

start_spot_mowing:
  name: Start spot mowing
  description: Start mowing for one or more explicit spot area IDs.
  target:
    entity:
      integration: dreame_a1
      domain: lawn_mower
  fields:
    spot_area_ids:
      name: Spot area IDs
      description: List of spot area IDs to mow, for example [2, 4].
      required: true
      example: [2, 4]

remote_move:
  name: Remote move
  description: One joystick step over the Dreame cloud (forward/back/turn).
  target:
    entity:
      integration: dreame_a1
      domain: lawn_mower
  fields:
    velocity:
      name: Velocity
      description: Forward positive, backward negative. Range -300 to 100.
      required: true
      example: 80
      selector:
        number:
          min: -300
          max: 100
          mode: box
    rotation:
      name: Rotation
      description: Left negative, right positive. Range -128 to 128.
      required: true
      example: 0
      selector:
        number:
          min: -128
          max: 128
          mode: box
